[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace-doctor"
version = "0.1.0"
description = "Read-only project environment diagnostics for Python, Node, and Docker repositories."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Varun Ruhella"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
workspace-doctor = "workspace_doctor.cli:main"
workspace_doctor = "workspace_doctor.cli:main"

[tool.setuptools.packages.find]
include = ["workspace_doctor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
